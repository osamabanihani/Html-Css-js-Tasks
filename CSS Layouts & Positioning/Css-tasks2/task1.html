<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Position</title>

    <link rel="stylesheet" href="task1.css">
</head>

<body>

    <!-- Static Example -->
    <section>
        <h3>position: static</h3>

        <div class="container">
            <div class="box">One</div>
            <div class="box green static-box">Two</div>
            <div class="box">Three</div>
            <div class="box">Four</div>
        </div>
    </section>


    <!-- Relative Example -->
    <section>
        <h3>position: relative</h3>

        <div class="container">
            <div class="box">One</div>
            <div class="box green relative-box">Two</div>
            <div class="box">Three</div>
            <div class="box">Four</div>
        </div>
    </section>


    <!-- Absolute Example -->
    <section>
        <h3>position: absolute</h3>

        <div class="container absolute-container">
            <div class="box">One</div>
            <div class="box green absolute-box">Two</div>
            <div class="box">Three</div>
            <div class="box">Four</div>
        </div>
    </section>

</body>
</html>
